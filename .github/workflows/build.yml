
name: Build CarLink APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CarLink-fa.zip.part000'
      - 'CarLink-fa.zip.part001'
      - 'CarLink-fa.zip.part002'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Join ZIP parts
        run: |
          cat CarLink-fa.zip.part000 \
              CarLink-fa.zip.part001 \
              CarLink-fa.zip.part002 > full.zip

          unzip -tq full.zip
          mkdir project
          unzip -q full.zip -d project

      - name: Find project
        run: |
          DIR=$(find project -type f -name gradlew -print -quit | xargs -r dirname)

          if [ -z "$DIR" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Diagnose Gradle configuration
        run: |
          echo "=== Gradle configuration files ==="

          find "$PROJECT_DIR" -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "libs.versions.toml" \
            -o -name "gradle.properties" \) \
            -print

          echo "=== Version catalog files ==="

          find "$PROJECT_DIR" -type f -name "libs.versions.toml" \
            -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;

          echo "=== Settings files ==="

          find "$PROJECT_DIR" -maxdepth 2 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        if: success()
        run: |
          mkdir -p output

          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} output/ \;

          if [ -z "$(find output -name '*.apk' -print -quit)" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-fa-apk
          path: output/*.apk
          if-no-files-found: error

      - name: Upload Gradle diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-gradle-diagnostics
          path: |
            project/**/build/reports/
          if-no-files-found: ignore
