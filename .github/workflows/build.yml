
name: Build CarLink APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CarLink
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. بررسی سه قسمت ZIP
      - name: Check ZIP parts
        run: |
          set -euo pipefail

          test -f CarLink-fa.zip.part000
          test -f CarLink-fa.zip.part001
          test -f CarLink-fa.zip.part002

          echo "All ZIP parts found."
          ls -lh CarLink-fa.zip.part*

      # 3. اتصال و استخراج ZIP
      - name: Join and extract source
        run: |
          set -euo pipefail

          cat \
            CarLink-fa.zip.part000 \
            CarLink-fa.zip.part001 \
            CarLink-fa.zip.part002 \
            > full.zip

          echo "Checking ZIP integrity..."
          unzip -t full.zip

          mkdir -p project
          unzip -q full.zip -d project

          echo "Searching for Gradle wrapper..."

          find project -type f -name gradlew

          DIR=$(find project -type f -name gradlew -printf '%h\n' | head -n 1)

          if [ -z "$DIR" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Project directory: $DIR"

      # 4. نصب Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 5. نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. تنظیم Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. بررسی پروژه
      - name: Check project files
        run: |
          set -euo pipefail

          java -version

          cd "$PROJECT_DIR"

          ls -lah

          test -f gradlew

      # 8. ساخت APK
      - name: Build Debug APK
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. بررسی خروجی
      - name: Locate APK
        run: |
          set -euo pipefail

          find project -type f -name "*.apk"

          if ! find project -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

      # 10. آپلود APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-fa-debug-apk
          path: project/**/*.apk
          if-no-files-found: error
          retention-days: 7

