name: Build CarLink APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Join parts and verify zip
        run: |
          cat CarLink-fa.zip.part* > full.zip
          ls -l CarLink-fa.zip.part* full.zip
          unzip -tq full.zip
          unzip -q full.zip -d project

      - name: Find project root
        run: |
          ROOT=$(grep -rl --include=settings.gradle.kts 'rootProject.name = "CarLink"' project | grep -v '/vendor/' | head -n 1 | xargs dirname)
          echo "ROOT=$ROOT"
          test -f "$ROOT/gradlew" || { echo "gradlew not found"; exit 1; }
          test -f "$ROOT/gradle/libs.versions.toml" || { echo "libs.versions.toml missing"; exit 1; }
          echo "PROJECT_DIR=$ROOT" >> $GITHUB_ENV
          ls -la "$ROOT" "$ROOT/gradle"

      - name: Patch DiAuto plugin alias
        run: |
          for f in "$PROJECT_DIR/vendor/diauto/app/build.gradle.kts" "$PROJECT_DIR/vendor/diauto/contract/build.gradle.kts"; do
            sed -i 's/alias(libs\.plugins\.android\.library)/id("com.android.library")/' "$f"
            echo "== $f"; grep -n 'com.android.library\|libs\.' "$f"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Check APK
        run: |
          APK=$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          echo "APK=$APK"
          test -n "$APK" && test -s "$APK"
          ls -l "$APK"
          unzip -l "$APK" | tail -n 3
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: CarLink-fa-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.PROJECT_DIR }}/build.log
            ${{ env.PROJECT_DIR }}/**/build/reports/**
          if-no-files-found: ignore
