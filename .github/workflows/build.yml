
name: Build CarLink APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CarLink-fa.zip.part000'
      - 'CarLink-fa.zip.part001'
      - 'CarLink-fa.zip.part002'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Join ZIP parts
        run: |
          cat CarLink-fa.zip.part000 CarLink-fa.zip.part001 CarLink-fa.zip.part002 > full.zip
          unzip -tq full.zip
          mkdir project
          unzip -q full.zip -d project

      - name: Check project files
        run: |
          DIR=$(find project -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$DIR" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project found: $DIR"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-fa-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
