name: Build CarLink APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Join parts and unzip
        run: |
          cat CarLink-fa.zip.part* > full.zip
          unzip -q full.zip -d project
          DIR=$(find project -maxdepth 2 -name gradlew -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CarLink-fa-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
